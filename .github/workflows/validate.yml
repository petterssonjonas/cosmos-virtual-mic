name: Validate development PR

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks (cosmos)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create the pinned cosmos toolbox
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-toolbox
          toolbox create --assumeyes --container cosmos --image registry.fedoraproject.org/fedora-toolbox@sha256:bb687ae7bbfc8b957b1ac04bb0fd92f8e443c657220e863cfdf76a692342d663
      - name: Install native build dependencies
        run: |
          toolbox run --container cosmos bash -euo pipefail -c '
            mapfile -t packages < dependencies-fedora.txt
            sudo dnf install -y "${packages[@]}" rustup python3
            rpm -q "${packages[@]}" rustup
          '
      - name: Validate the locked workspace
        run: |
          toolbox run --container cosmos bash -euo pipefail -c '
            source ./dev-env.sh
            /usr/bin/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
            toolchain=$(python3 -c "import tomllib; print(tomllib.load(open(\"rust-toolchain.toml\", \"rb\"))[\"toolchain\"][\"channel\"])")
            "$CARGO_HOME/bin/rustup" toolchain install "$toolchain" --profile minimal --component rustfmt,clippy,rust-src,rust-analyzer
            "$CARGO_HOME/bin/rustup" run "$toolchain" cargo fmt --all -- --check
            "$CARGO_HOME/bin/rustup" run "$toolchain" cargo build --workspace --locked
            "$CARGO_HOME/bin/rustup" run "$toolchain" cargo test --workspace --locked
            "$CARGO_HOME/bin/rustup" run "$toolchain" cargo clippy --workspace --all-targets --locked -- -D warnings
            python3 tests/session-policy.py
          '
