# SPDX-License-Identifier: MPL-2.0
[workspace]
members = ["crates/control", "crates/engine", "crates/mixer"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pipewire = { version = "=0.10.1", features = ["v1_2_0"] }
